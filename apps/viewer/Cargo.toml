[package]
name = "procgen-viewer"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
bevy = { version = "0.18.1", default-features = false, features = [
  "async_executor",
  "bevy_asset",
  "bevy_camera",
  "bevy_color",
  "bevy_core_pipeline",
  "bevy_gizmos",
  "bevy_gizmos_render",
  "bevy_image",
  "bevy_input_focus",
  "bevy_light",
  "bevy_log",
  "bevy_mesh",
  "bevy_pbr",
  "bevy_render",
  "bevy_shader",
  "bevy_state",
  "bevy_window",
  "bevy_winit",
  "default_font",
  "multi_threaded",
  "std",
  "wayland",
  "x11",
] }
bevy_egui = { version = "0.39.1", default-features = false, features = ["default_fonts", "render"] }
procgen-sphere = { path = "../../crates/procgen-sphere" }
procgen-sphere-mesh = { path = "../../crates/procgen-sphere-mesh" }
