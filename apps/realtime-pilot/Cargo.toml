[package]
name = "procgen-realtime-pilot"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[features]
default = ["inspector"]
inspector = ["dep:bevy", "dep:bevy_egui"]

[dependencies]
procgen-core = { path = "../../crates/procgen-core" }
procgen-noise = { path = "../../crates/procgen-noise" }
rayon = "1.12"
bevy = { version = "0.18.1", optional = true, default-features = false, features = [
  "async_executor", "bevy_asset", "bevy_camera", "bevy_color",
  "bevy_core_pipeline", "bevy_image", "bevy_log", "bevy_render",
  "bevy_shader", "bevy_window", "bevy_winit", "default_font",
  "multi_threaded", "std", "wayland", "x11",
] }
bevy_egui = { version = "0.39.1", optional = true, default-features = false, features = ["default_fonts", "render"] }
