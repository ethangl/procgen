[package]
name = "procgen-realtime-pilot"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[features]
default = ["inspector"]
inspector = ["dep:bevy", "dep:bevy_egui"]

[dependencies]
bytemuck = { version = "1.24", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
procgen-core = { path = "../../crates/procgen-core" }
procgen-noise = { path = "../../crates/procgen-noise" }
procgen-cubesphere = { path = "../../crates/procgen-cubesphere" }
rayon = "1.12"
bevy = { version = "0.18.1", optional = true, default-features = false, features = [
  "async_executor", "bevy_asset", "bevy_camera", "bevy_color",
  "bevy_core_pipeline", "bevy_image", "bevy_log", "bevy_render",
  "bevy_mesh", "bevy_light", "bevy_pbr", "bevy_shader", "bevy_window", "bevy_winit", "default_font",
  "multi_threaded", "png", "std", "wayland", "x11",
] }
bevy_egui = { version = "0.39.1", optional = true, default-features = false, features = ["default_fonts", "render", "manage_clipboard"] }
